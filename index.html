    <meta property="og:title" content="Sudoku & Chuỗi Lời Nhắn Bí Mật" />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <script>
      // Filter out dev WebSocket disconnect warnings in iframe/container preview environments
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason).includes('WebSocket') ||
          (event.reason.message && event.reason.message.includes('WebSocket'))
        )) {
          event.preventDefault();
        }
      });
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
